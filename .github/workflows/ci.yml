name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every pull request, with no paths filter. A paths-filtered workflow
  # produces no check row at all when it does not match, so a filtered scan
  # would be silently absent from exactly the pull request that needed it.
  #
  # It needs no secrets and no write permission, so it is safe on a fork pull
  # request, and the scan reads the diff rather than executing anything from
  # it. The script is kept in step with soroauth-go's copy; check 11's path
  # list is the only part that differs, because it names this repository's own
  # packages.
  supply-chain:
    name: supply chain scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scan diffs against the merge base, so it needs both sides.
          fetch-depth: 0

      - name: resolve the base revision
        id: base
        env:
          # From the event payload, never interpolated into the shell: a branch
          # name is attacker-controlled on a fork pull request.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ] && git cat-file -e "$BASE_REF" 2>/dev/null; then
            echo "sha=$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            git fetch -q origin main
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: scan the changed files
        run: ./scripts/supply-chain-scan.sh "${{ steps.base.outputs.sha }}" "$GITHUB_SHA"

      - name: explain a failure in the job summary
        if: failure()
        run: |
          {
            echo "## Supply chain scan found blocking issues"
            echo
            echo "The scan reports a pattern with no legitimate use in this repository."
            echo "Read the step log above: each finding names the file, the line and what matched."
            echo
            echo "Run it locally against your branch:"
            echo
            echo '```sh'
            echo './scripts/supply-chain-scan.sh origin/main HEAD'
            echo '```'
            echo
            echo "A finding is not automatically malicious — but it has to be explained"
            echo "in the pull request before the change can merge."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt clean:"
            echo "$unformatted"
            exit 1
          fi
      # The completion scripts are advertised for bash, zsh and fish, so each
      # must be parsed and exercised by its own shell here.
      # SOROAUTH_REQUIRE_SHELLS=1 turns a missing shell into a failure.
      - name: install completion shells
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh
      # Vet every build tag. -tags live only compiles the network test; it
      # does not run it.
      - name: vet
        run: |
          go vet ./...
          go vet -tags live ./...
      - name: test
        env:
          SOROAUTH_REQUIRE_SHELLS: "1"
        run: go test ./...
      - name: show the completion checks ran
        env:
          SOROAUTH_REQUIRE_SHELLS: "1"
        run: go test -count=1 -v -run 'Completion' ./cmd/soroauth-explain

  snapshot-drift:
    name: snapshots are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The generator refuses a dirty tree, and a fresh checkout is clean.
      - name: regenerate the inputs and snapshots
        run: go run ./cmd/gensnapshots

      # Inputs and snapshots are generated, committed artefacts. If
      # regenerating changes anything, then either one was edited by hand or
      # the code changed without its snapshots, and in both cases the
      # committed renderings no longer say what the code says.
      - name: fail on drift
        run: |
          drift="$(git status --porcelain)"
          if [ -n "$drift" ]; then
            echo "regenerating changed committed files:"
            echo "$drift"
            git --no-pager diff
            echo "run 'go run ./cmd/gensnapshots' on a clean tree, commit the result, and explain the change"
            exit 1
          fi
